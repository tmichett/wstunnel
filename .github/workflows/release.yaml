on:
  workflow_dispatch:
  push:
    branches: [ "main", "draft" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: 1.97
  BIN_NAME: "rhtlc-wstunnel"

jobs:
  check:
    name: Check - format, lint & tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          components: rustfmt, clippy

      - name: Install taplo-cli and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,cargo-nextest

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check TOML formatting
        run: taplo fmt --check

      - name: Lint
        run: cargo clippy --all --all-features --locked -- -D warnings

      - name: Test with aws-lc-rs
        run: cargo nextest run --locked

      - name: Test with ring
        run: cargo nextest run --locked --no-default-features --features ring

  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Static musl binaries — same executable for RPM (Fedora/RHEL) and .deb (Debian/Ubuntu) packaging.
          - name: Linux amd64
            target: x86_64-unknown-linux-musl
            build-args: "--release --features=jemalloc"
            use_cross: false

          - name: Linux arm64
            target: aarch64-unknown-linux-musl
            build-args: "--release --features=jemalloc"
            use_cross: true

          - name: macOS amd64
            os: macos-latest
            target: x86_64-apple-darwin
            build-args: "--release --features=jemalloc"
            use_cross: false

          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            build-args: "--release --features=jemalloc"
            use_cross: false

          - name: Windows amd64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            build-args: "--profile release-with-symbols"
            use_cross: false

          - name: Windows arm64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            build-args: "--profile release-with-symbols"
            use_cross: false

    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.platform.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          targets: ${{ matrix.platform.target }}

      - name: Install cross
        if: matrix.platform.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build ${{ matrix.platform.name }} binary
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ contains(matrix.platform.target, 'aarch64') && '14' || '12' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform.use_cross }}" == "true" ]]; then
            cross build ${{ matrix.platform.build-args }} --bin rhtlc-wstunnel --target ${{ matrix.platform.target }}
          else
            cargo build ${{ matrix.platform.build-args }} --bin rhtlc-wstunnel --target ${{ matrix.platform.target }}
          fi

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release${{ contains(matrix.platform.target, 'windows') && '-with-symbols' || '' }}/${{ env.BIN_NAME }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
          retention-days: 7

  release:
    name: Release
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release executables
        run: bash .github/scripts/prepare-release-assets.sh artifacts release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/rhtlc-wstunnel-linux-amd64
            release/rhtlc-wstunnel-linux-arm64
            release/rhtlc-wstunnel-macos-amd64
            release/rhtlc-wstunnel-macos-arm64
            release/rhtlc-wstunnel-windows-amd64.exe
            release/rhtlc-wstunnel-windows-arm64.exe
            release/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

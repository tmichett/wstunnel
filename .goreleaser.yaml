# Legacy GoReleaser config — kept for reference. GitHub releases are published by
# .github/workflows/release.yaml (direct executable upload, no archives).
builds:
  - goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: rhtlc-wstunnel
    main: goreleaser.go
    hooks:
      post:
        - ./.goreleaser_hook.sh "{{ .Arch }}" "{{ .Os }}" "{{ .Arm }}" "{{ .ProjectName }}"
checksum:
  name_template: "checksums.txt"
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  replace_existing_artifacts: true
  prerelease: auto
